# ==============================================================================
# MeteorEvents - Message Configuration
# All messages support MiniMessage tags (<gradient>, <rainbow>, <#hex>, <color>),
# standard legacy color codes (&), and placeholders.
# Placeholders: {meteor}, {world}, {x}, {y}, {z}, {player}, {time}, {type}
# ==============================================================================

# Chat message prefix prepended to informational plugin messages.
prefix: "<gradient:#ff8800:#ffff00>[MeteorEvents]</gradient>&r "

# Event stage announcements and broadcasts.
announcements:
  # Broadcast when a meteor omen begins.
  omen-chat: "&eA cosmic tremor shakes the sky above &f{world}&e! A meteor approaches!"
  omen-title: "<gradient:#ffaa00:#ff5500><bold>METEOR SIGHTED!</bold></gradient>"
  omen-subtitle: "&eWatch the heavens above {world}..."

  # Broadcast when the meteor begins its atmospheric crossing.
  crossing-chat: "&6The &f{meteor}&6 has pierced the atmosphere! Heading toward &eX: {x}, Z: {z}&6!"
  crossing-title: "<gradient:#ff3300:#ff9900><bold>INCOMING METEOR!</bold></gradient>"
  crossing-subtitle: "&eImpact imminent near &c{x}, {z}&e!"

  # Broadcast when the meteor strikes the surface.
  impact-chat: "&c&lIMPACT! &eThe &f{meteor}&e crashed at &c{x}, {y}, {z}&e! Explore the crater!"
  impact-title: "<gradient:#ff0000:#ff5500><bold>METEOR IMPACT!</bold></gradient>"
  impact-subtitle: "&eCrater formed at &c{x}, {y}, {z}&e!"

  # Warning broadcast before the core destabilizes and ends.
  despawn-warning: "&7The &f{meteor}&7 remnants at &e{x}, {z}&7 are cooling down and will destabilize soon..."

  # Broadcast when the exploration phase concludes.
  ended-chat: "&7The &f{meteor}&7 event has concluded. Remnants have settled."

  # Broadcast when a meteor expires without being looted.
  unlooted-despawn: "&7The &f{meteor}&7 at &e{x}, {z}&7 was not looted in time and has dissipated. The terrain has fully regenerated."

# Rewards and interaction messages.
rewards:
  # Title displayed on the loot inventory menu.
  chest-title: "<gradient:#ffaa00:#ffff55>Meteor Loot - {meteor}</gradient>"

  # Message when a player successfully claims the core chest.
  core-claimed-broadcast: "&aPlayer &f{player}&a claimed the rewards of the &f{meteor}&a core at &e{x}, {z}&a!"
  core-claimed-player: "&aYou have successfully unlocked the &f{meteor}&a core!"

  # Message when the core is still cooling down (timed lock).
  core-locked: "&cThis core is still dangerously hot! Wait &e{time}s&c for it to cool down."
  cooling-title: ""
  cooling-subtitle: "&c⏳ Cooling down: &e{time}s"

  # Message when the core requires a specific key item to open.
  core-key-required: "&cYou need a &e{key}&c to unlock this meteor core!"

  # Message when a player mines a meteorite fragment block.
  fragment-mined: "&6&l[+] &eYou excavated a fragment and obtained &f{fragment}&e!"

  # Message when a player receives participation rewards at impact.
  participation-reward: "&eYou witnessed the meteor impact and received &a+{xp} XP&e for bravery!"

# Administrative and command response messages.
admin:
  # When a meteor is manually started.
  event-started: "&aSuccessfully triggered meteor &f{type}&a in world &e{world}&a!"

  # When active events are stopped.
  event-stopped: "&cTerminated and regenerated &f{count}&c meteor event(s)."

  # When the configuration is reloaded.
  reloaded: "&aMeteorEvents configuration reloaded successfully."

  # When querying active events and none are active.
  no-active-events: "&eThere are currently no active meteor events."

  # Header and format for the /meteorevents info command.
  info-header: "&6=== &eActive Meteor Events ({count}) &6==="
  info-entry: "&7- &f{type}&7 in &e{world}&7 at &c{x}, {y}, {z} &7(Stage: &b{stage}&7, Time left: &e{time}s&7)"

  # Response for /meteorevents next command.
  next-scheduled: "&7Next automated meteor strike check in approx. &e{time}s&7."

  # Response for /meteorevents types command.
  types-list: "&6Available meteor types: &f{types}"

  # Response for /meteorevents test command.
  test-started: "&aSpawning safe visual test for &f{type}&a at your current location (no crater damage)."

  # Error when player does not have required permission.
  no-permission: "&cYou do not have permission to execute this command."

  # Error when an invalid meteor type is specified.
  unknown-type: "&cUnknown meteor type: &e{type}&c. Use &f/meteorevents types&c to list available types."

  # Error when no allowed world is available.
  no-valid-world: "&cCould not find a valid allowed world for the meteor strike."

# Protection and restriction messages.
protections:
  # When attempting to break or modify blocks in the crater before looting.
  crater-protected: "&cThis impact area is protected until the meteor is looted!"

# Packet hologram floating line configurations.
holograms:
  cooling-title: "<gradient:#ffaa00:#ff5500><bold>✦ {meteor} ✦</bold></gradient>"
  cooling-subtitle: "&c⏳ Cooling down: &e{time}s"
  unlocked-title: "<gradient:#55ff55:#ffff55><bold>✦ {meteor} ✦</bold></gradient>"
  unlocked-subtitle: "<gradient:#55ff55:#00aa00><bold>✔ UNLOCKED!</bold></gradient> &e[Right-Click to Loot]"
  unlocked-timer: "&e⏳ Regenerating in: &c{time}s"
  vanishing-title: "<gradient:#aaaaaa:#555555>✦ Remnants Destabilizing ✦</gradient>"
  vanishing-subtitle: "&7⏳ Vanishing in: &e{time}s"
