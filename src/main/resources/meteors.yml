# ==============================================================================
# MeteorEvents - Meteor Type Definitions
# Configure custom meteor types, appearances, velocities, trails, and impacts.
# ==============================================================================

meteors:
  # ----------------------------------------------------------------------------
  # Ember Meteor (Common)
  # Basic fiery meteor with frequent spawns, magma crater, and common loot.
  # ----------------------------------------------------------------------------
  ember:
    # Display name shown in chat broadcasts, titles, and holograms.
    # Supports MiniMessage tags (<gradient>, <rainbow>, <#hex>) and & color codes.
    display-name: "<gradient:#ff6600:#ffcc00><bold>Ember Meteor</bold></gradient>"

    # Rarity tier indicator.
    rarity: "COMMON"

    # Weight relative to other types when selecting a random meteor strike.
    # Higher weight = higher chance. Default: 50.
    weight: 50

    # Flight speed in blocks per tick along its trajectory.
    # Higher = faster fall. Valid range: 0.3 - 2.5. Default: 0.85.
    speed: 0.85

    # Initial vertical height (Y offset above the ground impact point).
    # Default: 110 blocks.
    start-height: 160
    horizontal-offset: 120
    visual-entity: "FIRE_CHARGE"
    # Scale multiplier for the packet display entity (e.g. 3.8 = huge).
    visual-entity-scale: 3.8
    # Whether smoke plumes billow from the crater perimeter after impact.
    smoke-plumes-enabled: true
    # Number of smoke plume generators placed around the crater.
    smoke-plumes-count: 10
    trail-particles:
      - "FLAME"
      - "LAVA"
      - "CAMPFIRE_COSY_SMOKE"
    crossing-sound: "ENTITY_FIREWORK_ROCKET_BLAST"
    impact-sound: "ENTITY_GENERIC_EXPLODE"
    impact-sound-volume: 16.0
    impact-sound-pitch: 0.8
    impact-particles-count: 140
    crater-radius: 4
    crater-depth: 3
    crater-materials:
      - "MAGMA_BLOCK"
      - "BASALT"
      - "OBSIDIAN"
    create-fire: true
    reward-table: "ember_loot"
    core-type: "CHEST"
    core-block: "MAGMA_BLOCK"
    fragment-count: 4
    fragment-block: "MAGMA_BLOCK"
    exploration-duration-seconds: 600
    unlock-type: "TIMED"
    lock-duration-seconds: 30
    loot-duration-seconds: 120
    required-key: "AIR"
    unstable-core: false

  # ----------------------------------------------------------------------------
  # Frostfall Meteor (Rare)
  # Glacial meteor with soul fire, snowflakes, blue ice, and chilly loot.
  # ----------------------------------------------------------------------------
  frostfall:
    display-name: "<gradient:#55ffff:#ffffff><bold>Frostfall Meteor</bold></gradient>"
    rarity: "RARE"
    weight: 25
    speed: 0.90
    start-height: 180
    horizontal-offset: 140
    visual-entity: "SNOWBALL"
    visual-entity-scale: 3.8
    smoke-plumes-enabled: true
    smoke-plumes-count: 12
    trail-particles:
      - "SOUL_FIRE_FLAME"
      - "SNOWFLAKE"
      - "FIREWORKS_SPARK"
    crossing-sound: "ENTITY_PHANTOM_SWOOP"
    impact-sound: "BLOCK_GLASS_BREAK"
    impact-sound-volume: 16.0
    impact-sound-pitch: 0.6
    impact-particles-count: 160
    crater-radius: 5
    crater-depth: 3
    crater-materials:
      - "BLUE_ICE"
      - "PACKED_ICE"
      - "SNOW_BLOCK"
    create-fire: false
    reward-table: "frostfall_loot"
    core-type: "CRYSTAL"
    core-block: "BLUE_ICE"
    fragment-count: 6
    fragment-block: "PACKED_ICE"
    exploration-duration-seconds: 600
    unlock-type: "TIMED"
    lock-duration-seconds: 30
    loot-duration-seconds: 120
    required-key: "AIR"
    unstable-core: true

  # ----------------------------------------------------------------------------
  # Voidfall Meteor (Epic)
  # Cosmic purple meteor with dragon breath, end stone, and mysterious rewards.
  # ----------------------------------------------------------------------------
  voidfall:
    display-name: "<gradient:#aa00ff:#ff55ff><bold>Voidfall Meteor</bold></gradient>"
    rarity: "EPIC"
    weight: 15
    speed: 0.95
    start-height: 200
    horizontal-offset: 160
    visual-entity: "ENDER_EYE"
    visual-entity-scale: 4.2
    smoke-plumes-enabled: true
    smoke-plumes-count: 14
    trail-particles:
      - "PORTAL"
      - "DRAGON_BREATH"
      - "REVERSE_PORTAL"
    crossing-sound: "ENTITY_ENDERMAN_TELEPORT"
    impact-sound: "ENTITY_ENDER_DRAGON_GROWL"
    impact-sound-volume: 16.0
    impact-sound-pitch: 0.7
    impact-particles-count: 180
    crater-radius: 6
    crater-depth: 4
    crater-materials:
      - "CRYING_OBSIDIAN"
      - "END_STONE"
      - "OBSIDIAN"
    create-fire: false
    reward-table: "voidfall_loot"
    core-type: "CRYSTAL"
    core-block: "CRYING_OBSIDIAN"
    fragment-count: 8
    fragment-block: "CRYING_OBSIDIAN"
    exploration-duration-seconds: 600
    unlock-type: "TIMED"
    lock-duration-seconds: 30
    loot-duration-seconds: 120
    required-key: "AIR"
    unstable-core: true

  # ----------------------------------------------------------------------------
  # Worldbreaker Meteor (Legendary)
  # Massive apocalyptic meteor with catastrophic visuals, deep crater, and treasures.
  # ----------------------------------------------------------------------------
  worldbreaker:
    display-name: "<gradient:#ff0000:#ff8800><bold>Worldbreaker Meteor</bold></gradient>"
    rarity: "LEGENDARY"
    weight: 5
    speed: 1.05
    start-height: 240
    horizontal-offset: 180
    visual-entity: "WORLDBREAKER_FIRE_CHARGE"
    visual-entity-scale: 5.5
    smoke-plumes-enabled: true
    smoke-plumes-count: 18
    trail-particles:
      - "EXPLOSION_LARGE"
      - "FLAME"
      - "LAVA"
      - "CAMPFIRE_COSY_SMOKE"
    crossing-sound: "ENTITY_WITHER_SPAWN"
    impact-sound: "ENTITY_LIGHTNING_BOLT_THUNDER"
    impact-sound-volume: 16.0
    impact-sound-pitch: 0.5
    impact-particles-count: 260
    crater-radius: 8
    crater-depth: 5
    crater-materials:
      - "ANCIENT_DEBRIS"
      - "OBSIDIAN"
      - "MAGMA_BLOCK"
      - "CRYING_OBSIDIAN"
    create-fire: true
    reward-table: "worldbreaker_loot"
    core-type: "CHEST"
    core-block: "ANCIENT_DEBRIS"
    fragment-count: 12
    fragment-block: "OBSIDIAN"
    exploration-duration-seconds: 600
    unlock-type: "TIMED"
    lock-duration-seconds: 30
    loot-duration-seconds: 120
    required-key: "AIR"
    unstable-core: true
